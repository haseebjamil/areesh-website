<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" fill="#121212"/>
  <defs>
    <radialGradient id="grad2" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="yellowLine2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C400" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5C400" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#grad2)"/>
  
  <!-- Subtle Geometry -->
  <circle cx="400" cy="380" r="280" stroke="#222222" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="400" cy="380" r="190" stroke="url(#yellowLine2)" stroke-width="2"/>
  
  <!-- Silhouette / Minimal Figure -->
  <g transform="translate(400, 420)">
    <!-- Head -->
    <circle cx="0" cy="-90" r="85" fill="#1E1E1E" stroke="#333333" stroke-width="2"/>
    <!-- Shoulders / Torso -->
    <path d="M-190 240 C-180 80, -110 30, 0 30 C110 30, 180 80, 190 240 Z" fill="#181818" stroke="#333333" stroke-width="2"/>
    <!-- Suit Collar -->
    <path d="M-60 30 L0 140 L60 30" stroke="#F5C400" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Typography & Coordinates -->
  <text x="50" y="880" fill="#F5C400" font-family="monospace" font-size="14" letter-spacing="4">EXECUTIVE // DIRECTOR</text>
  <text x="50" y="920" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">ADNAN BHATTI</text>
  <text x="50" y="950" fill="#888888" font-family="monospace" font-size="12" letter-spacing="2">AREESH TECHNOLOGIES LTD.</text>
</svg>
